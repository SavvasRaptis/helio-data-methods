[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "helio-data-methods"
version = "0.1.0"
description = "Teaching material for statistical modeling and machine learning in heliophysics."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [
  { name = "Savvas Raptis" },
]
dependencies = [
  "ipykernel>=6.29,<7",
  "jupyter-book>=1.0,<2",
  "pyyaml>=6.0,<7",
]

[dependency-groups]
dev = [
  "jupyterlab>=4.4,<5",
  "pytest>=8.4,<9",
]
notebooks = [
  "keras-tuner>=1.4,<2",
  "keras>=3.3,<4",
  "matplotlib>=3.8,<4",
  "nbclient>=0.10,<1",
  "nbformat>=5.10,<6",
  # Numba 0.62+ dropped macOS Intel wheels; SHAP otherwise triggers a local LLVM build.
  "numba>=0.61.2,<0.62",
  "numpy>=1.26,<2",
  "optuna>=4,<5",
  "pandas>=2.2,<3",
  "pillow>=10,<13",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
  "shap>=0.46,<1",
  "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "torch>=2.8,<3; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "torchvision==0.17.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "torchvision>=0.23,<1; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "xgboost>=2.1,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/helio_data_methods"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
required-version = "==0.11.15"
package = true
